name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Rebase merging lands PR commits on main verbatim, and release.yml decides
  # version bumps from their subjects — so every commit must be conventional.
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects are conventional
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert'
          bad=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -qE "^($types)(\([^)]*\))?!?: .+"; then
              echo "::error::Not a conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --format='%s' "$BASE..$HEAD")
          if [ "$bad" -ne 0 ]; then
            echo "Subjects must look like 'type: summary' (or 'type(scope): summary'," >&2
            echo "'type!: summary' for breaking changes) with type one of: $types" >&2
            exit 1
          fi

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
